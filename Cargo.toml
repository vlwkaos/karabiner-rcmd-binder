[package]
name = "karabiner-rcmd-binder"
version = "0.6.2"
edition = "2021"
description = "TUI for configuring Karabiner-Elements right_command key bindings"
license = "MIT"
authors = ["vlwkaos <vlwkaos@users.noreply.github.com>"]
homepage = "https://github.com/vlwkaos/karabiner-rcmd-binder"
repository = "https://github.com/vlwkaos/karabiner-rcmd-binder"

[[bin]]
name = "rcmdb"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
anyhow = "1"
glob = "0.3"
chrono = "0.4"

# Native window cycling (macOS only). `rcmdb cycle-window` reads the frontmost app
# via NSWorkspace and drives the Accessibility C API directly, replacing the former
# osascript/System Events helper. Pinned to the versions vendored in the local cargo
# cache so the build stays reproducible offline.
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
